<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | Ventas Web Tuleto</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-main { max-width: 1400px; margin: 2rem auto; padding: 0 5%; }
        .table-card { background: white; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); padding: 1.5rem; overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 0.5rem; }
        th { text-align: left; padding: 1rem; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 1.25rem 1rem; vertical-align: middle; background: white; }
        .badge { display: inline-block; padding: 0.35rem 0.85rem; border-radius: 100px; font-size: 0.75rem; font-weight: 700; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-done { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <header id="main-header">
        <h1>Tuleto Admin</h1>
        <nav>
            <a href="index.html">Tienda</a>
            <a href="admin.html">Gestión Web</a>
        </nav>
    </header>

    <main class="admin-main">
        <div class="section-title">
            <h3>Monitor de Ventas Web</h3>
            <div class="line"></div>
        </div>
        <div class="table-card">
            <table>
                <thead>
                    <tr><th>Fecha</th><th>Pedido</th><th>Producto</th><th>Cliente</th><th>Cant.</th><th>Total</th><th>Estado</th><th>Acción</th></tr>
                </thead>
                <tbody id="sales-body">
                    <tr><td colspan="8" style="text-align: center; padding: 3rem; color: var(--text-muted);">Cargando panel administrativo...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="app.js"></script>
    <script>document.addEventListener('DOMContentLoaded', loadWebSales);</script>
</body>
</html>
